  <div class="n-tools">

  </div>
</header>

<div class="n-shell">
  <aside class="n-side" aria-labelledby="n-list-title">
    <section class="n-sit" aria-labelledby="n-sit-title">
      <h2 class="n-kicker" id="n-sit-title" data-i18n="n.situation">Durum</h2>
      <div class="n-stats" id="n-stats"></div>
      <p class="n-pulse mono" id="n-pulse"></p>
    </section>

    <!-- The warning is not a footnote here: the source is close but it is not an aeronautical
         one, and a reader who takes a line on this map as a legal boundary has been misled. -->
    <p class="a-warn" id="a-warn"></p>

    <section class="n-board" aria-labelledby="a-seas-title">
      <div class="n-board-head">
        <h2 class="n-kicker" id="a-seas-title" data-i18n="h.seas">Denizlerin hava sahası</h2>
        <button type="button" id="n-clear" class="n-clear" hidden data-i18n="n.clear">Seçimi kaldır</button>
      </div>
      <div class="a-rows" id="a-seas"></div>
      <p class="n-fine" data-i18n="h.seasNote"></p>
    </section>

    <div class="n-list-head"><span id="n-list-title" data-i18n="h.firs">Uçuş bilgi bölgeleri</span><span id="n-count" class="mono"></span></div>
    <div id="n-list" class="n-list" role="list" tabindex="-1"></div>

    <p class="n-side-foot">
      <a href="assets/data/FIR-SOURCES.md" data-i18n="h.src">FIR kaynakları</a>
      <a href="https://github.com/Greater-Turkiye/handbook/blob/main/decisions/0022-trade-compliance-not-vessel-tracking.md" class="mono">ADR 0022</a>
    </p>
  </aside>

  <section class="n-map-wrap" aria-label="Harita / Map">
    <div id="n-map" class="n-map"></div>
    <p id="n-state" class="n-state" data-i18n="s.loading">Yükleniyor…</p>
    <div id="n-tip" class="n-tip" hidden></div>
    <div class="n-hud"><span><span data-i18n="p.cursor">İmleç</span> <b id="n-coords">—</b></span><span><span data-i18n="p.zoom">Ölçek</span> <b id="n-scale">1.0×</b></span></div>
    <div class="n-zoom">
      <button type="button" id="n-in" data-i18n-aria="p.zoomIn" aria-label="Yakınlaştır"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button type="button" id="n-out" data-i18n-aria="p.zoomOut" aria-label="Uzaklaştır"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button type="button" id="n-reset" data-i18n-aria="p.reset" aria-label="Görünümü sıfırla"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </div>
    <details class="n-legend" id="n-legend">
      <summary class="n-legend-sum" data-i18n="p.key">Harita anahtarı</summary>
      <div class="n-legend-body" id="a-legend"></div>
    </details>
  </section>
</div>
