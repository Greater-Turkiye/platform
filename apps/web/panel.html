<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSINT Paneli — Greater Türkiye</title>
<meta name="description" content="Türkiye ve çevresi için açık kaynak izleme paneli: doğrulanmış kayıtlar, izleme bölgeleri, tesisler.">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="page-panel">
<a class="skip" href="#p-feed" data-i18n="a11y.skip">İçeriğe geç</a>

<header class="site-header is-panel">
  <a class="brand" href="./" aria-label="Greater Türkiye — ana sayfa">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><circle cx="16" cy="16" r="7.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M16 .5v6M16 25.5v6M.5 16h6M25.5 16h6" stroke="currentColor" stroke-width="1.2"/><circle cx="16" cy="16" r="2.6" fill="#c8002a"/></svg>
    <span class="brand-word">GREATER<b>TÜRKİYE</b></span>
  </a>
  <span class="panel-title"><i class="live-dot" aria-hidden="true"></i><span data-i18n="p.title">OSINT paneli</span></span>
  <div class="panel-tools">
    <span class="mono">UTC <span class="clock" id="p-utc">--:--:--Z</span></span>
    <div class="lang" role="group" data-i18n-aria="a11y.lang" aria-label="Dil"><button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button></div>
  </div>
</header>

<div class="panel">
  <aside class="p-side" aria-labelledby="p-feed-title">
    <div class="p-filters">
      <label class="fld fld-search"><span class="sr-only" data-i18n="p.search">Ara</span><input id="f-search" type="search" data-i18n-placeholder="p.searchPh" placeholder="Kayıtlarda ara…" autocomplete="off"></label>
      <div class="fld-row">
        <label class="fld"><span data-i18n="p.region">Bölge</span><select id="f-region"></select></label>
        <label class="fld"><span data-i18n="p.type">Tür</span><select id="f-type"></select></label>
        <label class="fld"><span data-i18n="p.status">Durum</span><select id="f-status"></select></label>
      </div>
      <fieldset class="layers">
        <legend data-i18n="p.layers">Katmanlar</legend>
        <label class="tog"><input type="checkbox" id="l-regions" checked><span data-i18n="p.lyr.regions">Bölgeler</span></label>
        <label class="tog"><input type="checkbox" id="l-sites" checked><span data-i18n="p.lyr.sites">Tesisler</span></label>
        <label class="tog"><input type="checkbox" id="l-events" checked><span data-i18n="p.lyr.events">Olaylar</span></label>
        <label class="tog"><input type="checkbox" id="l-examples"><span data-i18n="p.lyr.examples">Örnek veriler</span></label>
      </fieldset>
    </div>
    <div class="p-feed-head"><span id="p-feed-title" data-i18n="p.feed">Kayıtlar</span><span id="p-count" class="mono"></span></div>
    <p id="p-banner" class="p-banner" hidden data-i18n="p.demo"></p>
    <div id="p-feed" class="p-feed" role="list" tabindex="-1"></div>
  </aside>

  <section class="p-map-wrap" aria-label="Harita / Map">
    <div id="p-map" class="p-map"></div>
    <div id="p-state" class="p-state">Yükleniyor</div>
    <div id="p-tip" class="p-tip" hidden></div>
    <div class="p-hud"><span><span data-i18n="p.cursor">İmleç</span> <b id="p-coords">—</b></span><span><span data-i18n="p.zoom">Ölçek</span> <b id="p-scale">1.0×</b></span></div>
    <div class="p-zoom">
      <button type="button" id="z-in" data-i18n-aria="p.zoomIn" aria-label="Yakınlaştır"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button type="button" id="z-out" data-i18n-aria="p.zoomOut" aria-label="Uzaklaştır"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 7h12" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button type="button" id="z-reset" data-i18n-aria="p.reset" aria-label="Görünümü sıfırla"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 0v4M8 12v4M0 8h4M12 8h4" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
    <div class="p-legend" aria-hidden="true">
      <span class="lg"><i class="tr"></i><span data-i18n="lg.tr">Türkiye</span></span>
      <span class="lg"><i></i><span data-i18n="lg.unverified">Doğrulanmamış</span></span>
      <span class="lg"><i class="warn"></i><span data-i18n="lg.partial">Kısmen / tartışmalı</span></span>
      <span class="lg"><i class="ok"></i><span data-i18n="lg.verified">Doğrulandı</span></span>
      <span class="lg"><i class="ex"></i><span data-i18n="lg.example">Örnek (kurgusal)</span></span>
      <span class="lg"><i class="site"></i><span data-i18n="lg.site">Tesis</span></span>
    </div>
  </section>

  <aside id="p-drawer" class="p-drawer" aria-hidden="true" aria-labelledby="p-d-title" inert>
    <button type="button" id="p-close" class="p-close" data-i18n-aria="p.close" aria-label="Kapat"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <div id="p-drawer-body"></div>
  </aside>
</div>

<script src="assets/vendor/d3.min.js"></script>
<script src="assets/vendor/topojson-client.min.js"></script>
<script src="assets/js/gt.js"></script>
<script src="assets/js/panel.js"></script>
</body>
</html>
