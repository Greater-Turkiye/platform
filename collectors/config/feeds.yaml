# Official RSS/Atom feeds confirmed on 2026-09-13 (fetched and parsed; see ../sources.md).
# Every feed stays `enabled: false` until its terms of use are confirmed by a maintainer and it
# has a `source_id` in the datasets source registry (datasets issue #4). Disabled feeds can
# still be tried locally:  gt-collect --feed <id> --dry-run
feeds:
  - id: rss-aze-mod
    kind: rss
    name: Azerbaijan Ministry of Defence — news
    country: AZE
    source_id: null
    url: https://mod.gov.az/az/rss/
    cadence_minutes: 60
    lang: az
    regions: [caucasus]
    enabled: false
    secrets: []
    notes: >-
      ~3 items/day, 240 items (~1.1 MB) per fetch, no ETag/Last-Modified. The /en/ and /ru/
      paths return the same Azerbaijani feed. No terms page found; footer says
      "© Ministry of Defense of Azerbaijan".

  - id: rss-rus-kremlin-news-en
    kind: rss
    name: President of Russia — news (English)
    country: RUS
    source_id: null
    url: http://en.kremlin.ru/events/president/news/feed
    cadence_minutes: 30
    lang: en
    regions: [global]
    enabled: false
    secrets: []
    terms: http://en.kremlin.ru/about/copyrights
    notes: >-
      Atom, 20 entries, ~5-9/day. HTTPS timed out from our vantage point; only plain HTTP
      answered. The terms page returned 403 to us, so its licence has not been confirmed.

  - id: rss-rus-kremlin-news-ru
    kind: rss
    name: Президент России — новости (Russian)
    country: RUS
    source_id: null
    url: http://kremlin.ru/events/president/news/feed
    cadence_minutes: 30
    lang: ru
    regions: [global]
    enabled: false
    secrets: []
    terms: http://en.kremlin.ru/about/copyrights
    notes: Atom, 20 entries, ~5/day. Same caveats as the English feed.

  - id: rss-lbn-army-en
    kind: rss
    name: Lebanese Army — news (English)
    country: LBN
    source_id: null
    url: https://www.lebarmy.gov.lb/en/rss.xml
    cadence_minutes: 60
    lang: en
    regions: [levant]
    enabled: false
    secrets: []
    terms: https://www.lebarmy.gov.lb/en/content/privacy-and-security
    notes: >-
      ~2-3/day, sends Last-Modified. Site policy says site information "may be distributed or
      copied unless otherwise specified" and asks for credit. TLS: certificate chain did not verify
      with Python's default trust store — the collector never disables verification, so this feed
      fails until the site fixes its chain.

  - id: rss-lbn-army-ar
    kind: rss
    name: الجيش اللبناني — أخبار (Arabic)
    country: LBN
    source_id: null
    url: https://www.lebarmy.gov.lb/ar/rss.xml
    cadence_minutes: 60
    lang: ar
    regions: [levant]
    enabled: false
    secrets: []
    terms: https://www.lebarmy.gov.lb/en/content/privacy-and-security
    notes: ~8/day. Same TLS caveat as the English feed.

  - id: rss-syr-sana-en
    kind: rss
    name: SANA (Syrian Arab News Agency, state agency) — English
    country: SYR
    source_id: null
    url: https://sana.sy/en/feed/
    cadence_minutes: 120
    lang: en
    regions: [syria]
    enabled: false
    secrets: []
    terms: https://sana.sy/en/terms-of-use/
    notes: >-
      State news agency (Ministry of Information), not MoD/MFA; neither of those publishes a feed.
      The feed parses and sends an ETag but was stale: newest item 2026-07-28. "All rights reserved".

  - id: rss-cyp-mod
    kind: rss
    name: Cyprus Ministry of Defence — announcements (Greek)
    country: CYP
    source_id: null
    url: https://www.gov.cy/mod/feed/
    cadence_minutes: 180
    lang: el
    regions: [cyprus]
    enabled: false
    secrets: []
    notes: >-
      Valid RSS (WordPress) but returns 403 to our descriptive User-Agent and 200 only to a
      browser User-Agent. We do not spoof user agents — needs publisher contact or stays off.
      ~1-2 items/week.

  - id: rss-cyp-mfa
    kind: rss
    name: Cyprus Ministry of Foreign Affairs — announcements (Greek)
    country: CYP
    source_id: null
    url: https://www.gov.cy/mfa/feed/
    cadence_minutes: 360
    lang: el
    regions: [cyprus]
    enabled: false
    secrets: []
    notes: Same 403-for-non-browser behaviour as rss-cyp-mod. Low volume (10 items span Jan-Jul 2026).

  - id: rss-rou-mfa
    kind: rss
    name: Romania Ministry of Foreign Affairs — news (Romanian)
    country: ROU
    source_id: null
    url: https://www.mae.ro/rss.xml
    cadence_minutes: 120
    lang: ro
    regions: [balkans, black-sea]
    enabled: false
    secrets: []
    notes: >-
      Valid RSS, ~2-3/day, sends Last-Modified. Resets the connection for our descriptive
      User-Agent and answers only a browser User-Agent. Stays off (no spoofing). The English feed
      (/en/rss.xml) is low volume (10 items span Mar-Jul 2026).

  # --- United Nations ---------------------------------------------------------------------
  # Checked on 2026-09-16 (fetched and parsed). These are the first feeds with `queue: true`:
  # un.org's copyright page allows news-related material to be used with credit, and the review
  # queue stores nothing but a link, a title and a <=500-character excerpt. They still have no
  # `source_id`, so they are `enabled: false` and are never sent to ingest.
  - id: un-news-en
    kind: rss
    name: UN News — all news (English)
    source_id: null
    url: https://news.un.org/feed/subscribe/en/news/all/rss.xml
    cadence_minutes: 120
    lang: en
    regions: [global]
    enabled: false
    queue: true
    secrets: []
    terms: https://www.un.org/en/about-us/copyright
    notes: >-
      RSS 2.0, 30 items (~34 kB), ~15-20/day. No ETag/Last-Modified, so keep the cadence low.
      The per-region feeds (/region/middle-east/, /region/europe/) answer HTTP 200 with an empty
      body, so the all-news feed is the only usable one.

  - id: un-news-ar
    kind: rss
    name: أخبار الأمم المتحدة — UN News (Arabic)
    source_id: null
    url: https://news.un.org/feed/subscribe/ar/news/all/rss.xml
    cadence_minutes: 120
    lang: ar
    regions: [global]
    enabled: false
    queue: false
    secrets: []
    terms: https://www.un.org/en/about-us/copyright
    notes: >-
      RSS 2.0, 30 items (~42 kB). Arabic edition of the all-news feed, same terms. Off until the
      review queue has reviewers for it: English alone already fills most of the 40-item cap, and
      the same story in two languages is not caught as a duplicate (SimHash is per language).

  - id: un-news-ru
    kind: rss
    name: Новости ООН — UN News (Russian)
    source_id: null
    url: https://news.un.org/feed/subscribe/ru/news/all/rss.xml
    cadence_minutes: 120
    lang: ru
    regions: [global]
    enabled: false
    queue: false
    secrets: []
    terms: https://www.un.org/en/about-us/copyright
    notes: RSS 2.0, 30 items (~48 kB). Russian edition of the all-news feed; same terms, same reason.

  - id: un-press-en
    kind: rss
    name: UN Meetings Coverage and Press Releases (English)
    source_id: null
    url: https://press.un.org/en/rss.xml
    cadence_minutes: 120
    lang: en
    regions: [global]
    enabled: false
    queue: true
    secrets: []
    terms: https://www.un.org/en/about-us/copyright
    notes: >-
      RSS 2.0, 10 items (~7 kB), sends an ETag. Security Council and General Assembly meetings
      coverage and Secretariat press releases — the closest thing to a UN document feed that
      parses. press.un.org/en/content/security-council/press-release/feed is not well-formed XML.

  - id: un-sg-en
    kind: rss
    name: UN Secretary-General — statements and messages (English)
    source_id: null
    url: https://www.un.org/sg/en/rss.xml
    cadence_minutes: 180
    lang: en
    regions: [global]
    enabled: false
    queue: true
    secrets: []
    terms: https://www.un.org/en/about-us/copyright
    notes: >-
      RSS 2.0, 10 items (~52 kB), sends an ETag. Low volume; the 10-item window can span months,
      so items may be older than the run that first sees them.

  # --- Leads: parse, but the terms could not be read ----------------------------------------
  - id: iaea-news-en
    kind: rss
    name: IAEA — news (English)
    source_id: null
    url: https://www.iaea.org/feeds/news
    cadence_minutes: 180
    lang: en
    regions: [global]
    enabled: false
    queue: false
    secrets: []
    notes: >-
      RSS 2.0, 150 items (~133 kB), sends an ETag, but no <pubDate> on any item. iaea.org/terms-of-use
      returns 403 to every User-Agent we tried, so the licence is unconfirmed: lead only until a
      maintainer reads the terms. Relevant for nuclear safeguards news in the region.
