# Official RSS/Atom feeds confirmed on 2026-09-13 (fetched and parsed; see ../sources.md).
#
# Two gates, and neither implies the other (see ../src/gt_collectors/config.py):
#   queue:   the feed is collected into the human review queue. A maintainer sets it only after
#            reading the source's terms, and `terms:` must point at the page they read.
#   enabled: the feed may be sent straight to the ingest Worker. Everything now has a `source_id`
#            from the datasets registry, but this stays false: for now every candidate passes a
#            human first (ADR 0007).
#
# Terms review of 2026-09-20 — what was actually fetched and read, not assumed:
#
#   kremlin.ru          Creative Commons Attribution 4.0, stated in writing on the copyrights
#                       page: reproduction without limit, on condition of a reference. -> queue
#   un.org              "News-related material can be used as long as the appropriate credit is
#                       given and the United Nations is advised." -> queue (all five UN feeds)
#   hnhs.gr             "Viewing and printing ... permitted ... solely for information purposes.
#                       The exchange, modification, sale, transmission or other commercial use of
#                       any information contained in this site is prohibited." An excerpt in a
#                       public queue issue is a transmission, and a summary is a modification, so
#                       the NAVTEX messages are NOT taken as text. Their *facts* — position,
#                       activity class, time, message number — are not copyrightable and are read
#                       by a separate collector that stores no wording. -> stays off here
#   iaea.org            terms-of-use answers 403 to our descriptive client; terms unconfirmed,
#                       so no excerpt is stored. -> stays off
#   gov.cy (mod, mfa)   feed and robots.txt both answer 403 to our descriptive client. We do not
#                       send a browser User-Agent to get past a block. -> stays off
#   mae.ro              terms page answers 503; unconfirmed. -> stays off
#   lebarmy.gov.lb      no terms page found (404). -> stays off
#   mod.gov.az          no terms page; footer asserts ministry copyright. -> stays off
#   sana.sy             terms page exists but states no reuse permission. -> stays off
#
#
# Terms review of 2026-09-23 — 35 candidate feeds probed with our own client; what passed and why:
#
#   gov.uk (MoD)        Open Government Licence v3: "copy, publish, distribute and transmit",
#                       "adapt", commercial or not, on condition of attribution. -> queue
#   defense.gov         Works of the United States Government are not subject to copyright
#                       (17 U.S.C. § 105). The site's own terms page answers 403 to a reader, so
#                       the statute is the page cited. -> queue (releases + news)
#   tass.com            "prohibited to Use the Text Materials ... in RSS feeds, or databases
#                       without the written consent of TASS" -> off
#   icrc.org            copying permitted only "entirely" with "no modifications"; an excerpt is
#                       a modification -> off
#   reliefweb.int       aggregates third-party content under those parties' rights; terms page
#                       403 to a reader -> off
#   irna.ir             feed answers (30 items/day) but no terms page could be found -> off
#   kyivindependent.com terms page 404 -> off      aa.com.tr  terms page 404, paid wire -> off
#   nato.int, defense.gouv.fr, bmvg.de, mod.bg, mapn.ro (410), mod.gov.ua, gov.kz, osce.org,
#   eeas.europa.eu, peacekeeping.un.org: no feed found by autodiscovery or on known paths
#   mod.mil.gr, geetha.mil.gr, mfa.gr, mod.gov.ge, msb.gov.tr, gov.il, timesofisrael: 403 to
#   our client; we do not send a browser User-Agent to get past a block.
#
# Disabled feeds can still be tried locally:  gt-collect --feed <id> --dry-run
