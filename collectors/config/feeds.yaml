    kind: rss
    name: UK Ministry of Defence — news and communications
    country: GBR
    url: https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=ministry-of-defence
    cadence_minutes: 60
    lang: en
    regions: [global]
    enabled: false
    queue: true
    terms: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
    secrets: []
    notes: >-
      Open Government Licence v3. ~20 items per fetch, updated several times a day; carries
      deployments, exercises and procurement announcements across NATO's eastern and southern
      flanks. Attribution: "Contains public sector information licensed under the OGL v3.0."
      Measured 2026-09-23: 4 of 20 items reached the queue (Saudi support, Ukraine air defence,
      Poland air defence).

