# İlgi süzgeci tabloları / relevance filter tables — gt-relevance/1
#
# Bu dosya VERİDİR, kod değildir: yeni bir yer adı veya olay sözcüğü eklemek için kodu
# değiştirmenize gerek yoktur. / This file is DATA, not code: adding a place name or an event
# keyword needs no code change. See collectors/README.md, "İlgi süzgeci / Relevance filter".
#
# Nasıl puanlanır / How it scores (gt_collectors/relevance.py):
#   region_score = her bölge için eşleşen ayrı ifadelerin ağırlık toplamı, 1.0'da sınırlı
#                  (başlıkta geçen `weights.title`, yalnız özette geçen `weights.text` eder);
#                  metin hiçbir bölge adı vermezse akışın kendi bölgesi `weights.feed_region` eder
#   topic_score  = eşleşen her olay türü grubunun ağırlığı, 1.0'da sınırlı
#   score        = weights.region * region_score + weights.topic * topic_score
#                  ve iki sinyalden biri sıfırsa score = 0 (ikisi de gerekir)
#   score >= threshold - margin  -> kuyruğa girer / enters the queue
#   score <  threshold           -> "sınırda / borderline" işaretiyle girer / marked borderline
#   score <  threshold - margin  -> kuyruğa girmez, yapıtta kalır / stays in the artifact only
#
# Eşleşme / matching: Unicode NFKC + casefold + aksan kaldırma ("İran" = "iran", "Irak" = "ırak"),
# sözcük sınırlarıyla. Sonuna `*` konan ifade ön ek eşleşmesidir ("konuşlan*" -> "konuşlandırıldı"),
# Türkçe'nin ekleri için. / A trailing `*` makes the entry a prefix match, for Turkish suffixes.
#
# UYARI / WARNING: bu süzgeç yalnızca GÜRÜLTÜ içindir. Güvenlik süzgeci (safety.py) ve coğrafi
# çit (geo.py) ondan önce ve bu dosyadan bağımsız çalışır; buraya yazılan hiçbir şey onları
# gevşetemez. / This filter is for NOISE only. The safety filter and the geofence run before it
# and are not configurable from here.
schema: gt-relevance/1

# Eşik ve belirsizlik payı / threshold and uncertainty margin. Gerekçe README'de.
threshold: 0.5
margin: 0.1

weights:
  region: 0.5 # bileşik puandaki payı / share of the combined score
  topic: 0.5
  title: 1.0 # başlıkta geçen ifade / a phrase found in the title
  text: 0.4 # yalnızca özette geçen ifade / a phrase found only in the excerpt
  feed_region: 0.5 # metin bölge adı vermediğinde akışın kendi bölgesi / the feed's own region

# Bölge eşleşmesinden ÖNCE metinden silinen ifadeler: yanlış arkadaşlar.
# Phrases blanked out before region matching only (false friends).
exclude:
  - south sudan
  - güney sudan
  - south korea
  - north korea
  - güney kore
  - kuzey kore
  - west georgia
  - georgia state

