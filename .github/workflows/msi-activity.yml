name: msi-activity

# Monthly refresh of the announced-activity series (apps/web/assets/data/msi-activity.json).
#
#   NGA archive (public domain) -> region filter -> classify -> counts per year
#
# When the figures move it commits them to a branch of their own and opens the pull request that
# lands them, falling back to an issue with a one-click compare link if this organisation does not
# allow Actions to open pull requests. What is left for a maintainer is to look at the diff and
# decide, which is what ADR 0007 asks for and all it asks for. It never pushes to `main`.
#
# The run needs no secret. It downloads ~112 MB from msi.nga.mil into the runner's temp directory
# and writes nothing outside it except the branch it pushes.
on:
  schedule:
    - cron: "41 4 3 * *" # the 3rd of each month, 04:41 UTC (off the hour; the archive is not urgent)
  workflow_dispatch:

permissions: {}

concurrency:
  group: msi-activity
  cancel-in-progress: false

env:
  DATA: apps/web/assets/data/msi-activity.json
  LABEL: veri-guncellemesi

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the rebuilt series to a branch of its own
      pull-requests: write # and open the pull request that lands it
      issues: write # or say so in an issue, if the organisation does not allow that
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kept on purpose: this run pushes the rebuilt series to a branch of its own.
          # It never pushes to `main`, which the ruleset protects anyway.
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Keep the committed series for comparison
        run: cp "$DATA" "$RUNNER_TEMP/previous.json"

      - name: Rebuild from the NGA archive
        env:
          GT_MSI_CACHE: ${{ runner.temp }}/msi-cache
        run: python tools/msi/build_activity.py --refresh

      - name: Compare
        id: diff
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          new = json.loads(pathlib.Path(os.environ["DATA"]).read_text(encoding="utf-8"))
          old = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "previous.json").read_text(encoding="utf-8"))
          nb, ob = new["built_from"], old["built_from"]
          changed = nb["records_kept"] != ob["records_kept"]
          print(f"changed={'true' if changed else 'false'}")
          lines = [
              "| | öncesi / before | sonrası / after |",
              "|---|---:|---:|",
              f"| bölge ihbarı / warnings kept | {ob['records_kept']} | {nb['records_kept']} |",
              f"| Türk ihbarı sayılmadı / Turkish excluded | {ob['turkish_warnings_excluded']} | {nb['turkish_warnings_excluded']} |",
              f"| yıllar / years | {ob['years']} | {nb['years']} |",
          ]
          new_years = {s["year"]: s for s in new["series"]}
          old_years = {s["year"]: s for s in old["series"]}
          moved = [y for y in sorted(new_years) if new_years[y]["total"] != old_years.get(y, {}).get("total")]
          if moved:
              lines.append("")
              lines.append("Değişen yıllar / years that moved: " + ", ".join(
                  f"{y} ({old_years.get(y, {}).get('total', 0)} → {new_years[y]['total']})" for y in moved[-12:]))
          pathlib.Path(os.environ["RUNNER_TEMP"], "summary.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Write what moved
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          {
            echo "NGA arşivinden yeniden üretilen seri, depodaki dosyadan farklı."
            echo "The series rebuilt from the NGA archive differs from the one in the repository."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Hiçbir sayı henüz bir insan tarafından yargılanmadı; bu PR'ı incelemek tam olarak onun içindir (ADR 0007)."
            echo "No figure here has been judged by a person yet: reviewing this pull request is exactly what that is for."
            echo
            echo "- [ ] Kapsama değişimi mi, faaliyet değişimi mi? \`by_authority\` ve \`archive_all_areas\` sütunlarına bakıldı / coverage or activity?"
            echo "- [ ] \`MSI-ACTIVITY-SOURCES.md\` içindeki sayılar güncellendi / the figures in the source document updated"
            echo
            echo "Yerelde aynı dosyayı üretmek için / to reproduce the same file locally:"
            echo '```bash'
            echo "python tools/msi/build_activity.py --refresh"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

      - name: Land it
        if: steps.diff.outputs.changed == 'true'
        uses: ./.github/actions/land-data
        with:
          name: msi-activity
          paths: apps/web/assets/data/msi-activity.json
          title: "İlan edilen faaliyet serisi güncellendi / The announced-activity series moved"
          body-file: ${{ runner.temp }}/body.md

      - name: Nothing moved
        if: steps.diff.outputs.changed != 'true'
        run: echo "::notice::the rebuilt series matches the committed one"
