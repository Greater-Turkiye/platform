name: msi-activity

# Monthly refresh of the announced-activity series (apps/web/assets/data/msi-activity.json).
#
#   NGA archive (public domain) -> region filter -> classify -> counts per year
#
# Why this opens an issue instead of a pull request: this organisation does not allow Actions to
# create pull requests, and `main` is protected, so a workflow cannot land the file itself. It
# therefore rebuilds the series, compares it with the committed one, and — when the numbers move —
# attaches the new file as an artifact and tells a maintainer, who lands it with one command. That
# also keeps a human between a third party's archive and what the site publishes, which is what
# ADR 0007 asks for anyway.
#
# The run needs no secret. It downloads ~112 MB from msi.nga.mil into the runner's temp directory
# and writes nothing outside it except the artifact.
on:
  schedule:
    - cron: "41 4 3 * *" # the 3rd of each month, 04:41 UTC (off the hour; the archive is not urgent)
  workflow_dispatch:

permissions: {}

concurrency:
  group: msi-activity
  cancel-in-progress: false

env:
  DATA: apps/web/assets/data/msi-activity.json
  LABEL: veri-guncellemesi

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write # tell a maintainer that the series moved
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Keep the committed series for comparison
        run: cp "$DATA" "$RUNNER_TEMP/previous.json"

      - name: Rebuild from the NGA archive
        env:
          GT_MSI_CACHE: ${{ runner.temp }}/msi-cache
        run: python tools/msi/build_activity.py --refresh

      - name: Compare
        id: diff
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          new = json.loads(pathlib.Path(os.environ["DATA"]).read_text(encoding="utf-8"))
          old = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "previous.json").read_text(encoding="utf-8"))
          nb, ob = new["built_from"], old["built_from"]
          changed = nb["records_kept"] != ob["records_kept"]
          print(f"changed={'true' if changed else 'false'}")
          lines = [
              "| | öncesi / before | sonrası / after |",
              "|---|---:|---:|",
              f"| bölge ihbarı / warnings kept | {ob['records_kept']} | {nb['records_kept']} |",
              f"| Türk ihbarı sayılmadı / Turkish excluded | {ob['turkish_warnings_excluded']} | {nb['turkish_warnings_excluded']} |",
              f"| yıllar / years | {ob['years']} | {nb['years']} |",
          ]
          new_years = {s["year"]: s for s in new["series"]}
          old_years = {s["year"]: s for s in old["series"]}
          moved = [y for y in sorted(new_years) if new_years[y]["total"] != old_years.get(y, {}).get("total")]
          if moved:
              lines.append("")
              lines.append("Değişen yıllar / years that moved: " + ", ".join(
                  f"{y} ({old_years.get(y, {}).get('total', 0)} → {new_years[y]['total']})" for y in moved[-12:]))
          pathlib.Path(os.environ["RUNNER_TEMP"], "summary.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Attach the rebuilt series
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msi-activity
          path: ${{ env.DATA }}
          retention-days: 30

      - name: Tell a maintainer
        if: steps.diff.outputs.changed == 'true'
        env:
          TITLE: "İlan edilen faaliyet serisi güncellendi / The announced-activity series moved"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "NGA arşivinden yeniden üretilen seri, depodaki dosyadan farklı."
            echo "The series rebuilt from the NGA archive differs from the one in the repository."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Yeni dosya bu çalışmanın \`msi-activity\` artefaktındadır / the new file is the \`msi-activity\` artifact of [this run]($RUN)."
            echo
            echo "Yerelde almak için / to take it locally:"
            echo '```bash'
            echo "python tools/msi/build_activity.py --refresh   # aynı dosyayı üretir / produces the same file"
            echo '```'
            echo
            echo "- [ ] Kapsama değişimi mi, faaliyet değişimi mi? \`by_authority\` ve \`archive_all_areas\` sütunlarına bakıldı / coverage or activity? checked against \`by_authority\` and \`archive_all_areas\`"
            echo "- [ ] \`MSI-ACTIVITY-SOURCES.md\` içindeki sayılar güncellendi / the figures in the source document updated"
          } > "$RUNNER_TEMP/issue.md"
          gh label create "$LABEL" --description "Bir veri dosyası kaynağında değişti" --color BFD4F2 2>/dev/null || true
          number=$(gh issue list --state open --label "$LABEL" --json number,title \
            | python3 -c 'import json,os,sys; t=os.environ["TITLE"]; print(next((str(i["number"]) for i in json.load(sys.stdin) if i["title"] == t), ""))')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Nothing moved
        if: steps.diff.outputs.changed != 'true'
        run: echo "::notice::the rebuilt series matches the committed one"
