name: trade-vessels

# Monthly refresh of the two data files behind ticaret.html and deniz.html:
#
#   apps/web/assets/data/trade-il.json          UN Comtrade, both reporters, by month
#   apps/web/assets/data/vessels-sanctioned.json + vessels-summary.json   OFAC SDN + UN list
#
# When the figures move it commits them to a branch of their own and opens the pull request that
# lands them, falling back to an issue with a one-click compare link if this organisation does not
# allow Actions to open pull requests. What is left for a maintainer is to look at the diff and
# decide, which is what ADR 0007 asks for and all it asks for. It never pushes to `main`.
#
# The run needs no secret and no account: the Comtrade preview API takes no key, and the sanctions
# lists are published for exactly this use.
#
# Comtrade is asked for roughly five hundred month-by-reporter queries, so the downloads are cached
# between runs. The cache is restored by prefix, the most recent months are dropped from it before
# the build, and the rest is reused: a month already downloaded does not move, and a month the UN
# has since revised does. Without that a monthly run would re-download three years of history to
# learn one month of news.
on:
  schedule:
    - cron: "17 5 6 * *" # the 6th of each month, 05:17 UTC — Comtrade publishes with a lag anyway
  workflow_dispatch:

permissions: {}

concurrency:
  group: trade-vessels
  cancel-in-progress: false

env:
  TRADE: apps/web/assets/data/trade-il.json
  VESSELS: apps/web/assets/data/vessels-summary.json
  LABEL: veri-guncellemesi

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # push the rebuilt files to a branch of their own
      pull-requests: write # and open the pull request that lands them
      issues: write # or say so in an issue, if the organisation does not allow that
    env:
      GH_TOKEN: ${{ github.token }}
      GT_TRADE_CACHE: ${{ github.workspace }}/.comtrade-cache
      GT_VESSEL_CACHE: ${{ github.workspace }}/.vessel-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # kept on purpose: this run pushes the rebuilt files to a branch of their own.
          # It never pushes to `main`, which the ruleset protects anyway.
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Restore the Comtrade downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.0.2
        with:
          path: ${{ env.GT_TRADE_CACHE }}
          key: comtrade-${{ github.run_id }}
          restore-keys: comtrade-

      - name: Drop the months the UN may still revise
        # A figure is revised for a while after it is first published, so the recent past is
        # fetched again on every run while the settled history is taken from the cache.
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, os, pathlib
          cache = pathlib.Path(os.environ["GT_TRADE_CACHE"])
          if not cache.exists():
              print("no cache yet"); raise SystemExit
          today = dt.datetime.now(tz=dt.UTC)
          keep_from = today.year * 12 + today.month - 1 - 9   # the last nine months are refetched
          dropped = 0
          for f in cache.glob("*-*-*-*-*.json"):
              period = f.stem.split("-")[3]
              if len(period) != 6 or not period.isdigit():
                  continue
              if int(period[:4]) * 12 + int(period[4:]) - 1 >= keep_from:
                  f.unlink(); dropped += 1
          print(f"dropped {dropped} cached months; {len(list(cache.glob('*.json')))} kept")
          PY

      - name: Keep the committed files for comparison
        run: |
          cp "$TRADE" "$RUNNER_TEMP/trade-previous.json"
          cp "$VESSELS" "$RUNNER_TEMP/vessels-previous.json"

      - name: Rebuild the trade series
        run: python tools/trade/build_trade.py

      - name: Rebuild vessel identity
        run: python tools/vessels/build_vessels.py --refresh

      - name: Compare
        id: diff
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib

          def load(p):
              return json.loads(pathlib.Path(p).read_text(encoding="utf-8"))

          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          new_t, old_t = load(os.environ["TRADE"]), load(tmp / "trade-previous.json")
          new_v, old_v = load(os.environ["VESSELS"]), load(tmp / "vessels-previous.json")

          def last(d):
              return d["series"][-1]["period"] if d.get("series") else "-"

          def reported_absences(d):
              after = [s for s in d["series"] if s["period"] > d.get("windows", {}).get("halt", "202405")]
              return sum(1 for s in after if s["tur_exports_to_isr"] is None and s["tur_reported_that_month"]), len(after)

          moved = (
              last(new_t) != last(old_t)
              or new_t.get("windows") != old_t.get("windows")
              or new_v["counts"] != old_v["counts"]
          )
          print(f"changed={'true' if moved else 'false'}")

          na, ta = reported_absences(new_t)
          oa, to = reported_absences(old_t)
          lines = [
              "| | öncesi / before | sonrası / after |",
              "|---|---|---|",
              f"| serinin son ayı / last month in the series | `{last(old_t)}` | `{last(new_t)}` |",
              f"| karşılaştırma penceresi, rotalar / routes window | `{(old_t.get('windows') or {}).get('routes_after')}` | `{(new_t.get('windows') or {}).get('routes_after')}` |",
              f"| karşılaştırma penceresi, ürünler / goods window | `{(old_t.get('windows') or {}).get('goods_after')}` | `{(new_t.get('windows') or {}).get('goods_after')}` |",
              f"| raporlanmış yokluk ayı / reported absences | {oa}/{to} | {na}/{ta} |",
              f"| yaptırımlı gemi / vessels listed | {old_v['counts']['vessels']} | {new_v['counts']['vessels']} |",
              f"| önceki bayrağı kayıtlı / with a former flag | {old_v['counts']['with_former_flag']} | {new_v['counts']['with_former_flag']} |",
          ]
          pathlib.Path(tmp / "summary.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Write what moved
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          {
            echo "UN Comtrade ve yaptırım listelerinden yeniden üretilen dosyalar depodakinden farklı."
            echo "The files rebuilt from UN Comtrade and the sanctions lists differ from the ones in the repository."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Hiçbir rakam henüz bir insan tarafından yargılanmadı; bu PR'ı incelemek tam olarak onun içindir (ADR 0007)."
            echo "No figure here has been judged by a person yet: reviewing this pull request is exactly what that is for."
            echo
            echo "- [ ] Pencere kaydıysa \`TRADE-SOURCES.md\` içindeki rakamlar ve fasıl tablosu güncellendi / if the window rolled, the figures and the chapter table updated"
            echo "- [ ] Raporlanmış yokluk sayısı düştüyse sebebi Türkiye'nin yayın gecikmesi mi, ticaretin kendisi mi ayırt edildi / if reported absences fell, checked whether that is Türkiye's publishing lag or the trade itself"
            echo "- [ ] Gemi sayısı sıçradıysa yeni listeleme mi, kaynak biçimi değişikliği mi bakıldı / if the vessel count jumped, checked for a new designation against a change in the source format"
            echo
            echo "Yerelde aynı dosyaları üretmek için / to reproduce the same files locally:"
            echo '```bash'
            echo "python tools/trade/build_trade.py"
            echo "python tools/vessels/build_vessels.py --refresh"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

      - name: Land them
        if: steps.diff.outputs.changed == 'true'
        uses: ./.github/actions/land-data
        with:
          name: trade-vessels
          paths: |
            apps/web/assets/data/trade-il.json
            apps/web/assets/data/vessels-sanctioned.json
            apps/web/assets/data/vessels-summary.json
          title: "Ticaret ve gemi verisi güncellendi / The trade and vessel figures moved"
          body-file: ${{ runner.temp }}/body.md

      - name: Nothing moved
        if: steps.diff.outputs.changed != 'true'
        run: echo "::notice::the rebuilt files match the committed ones"
