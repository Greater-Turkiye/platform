name: publishers-ci

# Test the publishing skeleton (standard library only). Nothing here posts, and one of the tests
# exists to keep it that way: it fails if any module in gt_publishers imports a networking library.
on:
  pull_request:
    paths:
      - "publishers/**"
      - ".github/workflows/publishers-ci.yml"

permissions:
  contents: read

concurrency:
  group: publishers-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: publishers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install "pytest>=9,<10"
      - name: Tests
        run: python -m pytest -q tests
      - name: The example message passes its own checks
        run: python -m gt_publishers check --message examples/bulletin.example.json
