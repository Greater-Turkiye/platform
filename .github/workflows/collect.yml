name: collect

# Daily signal collection into a human review queue.
#
#   fetch -> parse -> normalize -> SAFETY FILTER + geofence -> dedup ledger
#     -> issue + artifact -> publish the batch on `collector-state`  (-> a Worker pulls it into D1)
#
# Nothing here publishes anything: the run opens one issue of **unverified candidates** for a
# human to triage (ADR 0007). The safety filter and the geofence run in memory, before anything
# is written to a file, an artifact, an issue or the database.
#
# **This workflow needs no Cloudflare credential.** It publishes the batch it would have inserted
# — the same rows, the same triage statuses — next to the dedup ledger on the `collector-state`
# branch, and the `gt-ingest` Worker (apps/ingest) pulls it from there into `gt-signals` and
# `gt-ops.reviews`. That Worker runs inside the Cloudflare account that owns both databases, so
# its D1 bindings are its authorisation and no token has to exist on either side. Only what the
# safety filter and the geofence already allowed is published, and never more than what goes into
# D1 (collectors/src/gt_collectors/batch.py).
#
# The last step is the old push path, kept for a maintainer's machine (`wrangler login`), where it
# still writes both databases directly. In CI its **absence is the normal case**: with no
# `CLOUDFLARE_API_TOKEN` secret it logs one line and does nothing, and the pipeline is complete
# without it, because the Worker has already been given everything it needs.
#
# Keeping the schedule alive: GitHub disables `schedule:` in a public repository after 60 days
# without repository activity. Every run with anything to publish — a queued item, or only items
# the relevance filter set aside — pushes a commit to the `collector-state` branch, which is
# repository activity; a run that collected nothing at all pushes nothing. GitHub emails the
# maintainers first, and `workflow_dispatch` (Actions -> collect -> Run workflow) re-arms it.
#
# `main` is protected (pull request + review), so the bot never commits there: the ledger and the
# published batches live on the `collector-state` branch, created by the first run.
on:
  schedule:
    - cron: "23 5,11,17,23 * * *" # every six hours, off the hour (ADR 0025); one issue a day, later runs comment
  workflow_dispatch:
    inputs:
      max_items:
        description: "Most candidates in one issue (the rest wait for the next run)"
        required: false
        default: "40"
      dry_run:
        description: "Collect only: no issue, no ledger commit"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: collect
  cancel-in-progress: false

env:
  STATE_BRANCH: collector-state
  LEDGER: collectors/state/seen.jsonl
  BATCHES: collectors/state/batches
  LABEL: inceleme-kuyrugu

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the dedup ledger to the collector-state branch
      issues: write # open the review queue issue and create its label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15" # pinned like every other tool here; Dependabot bumps the action
          python-version: "3.13"

      - name: Restore the dedup ledger
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$LEDGER")"
          # Anonymous fetch: the repository is public and the branch may not exist yet.
          if git fetch --no-tags --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:$LEDGER" > "$LEDGER" 2>/dev/null || : > "$LEDGER"
            echo "ledger: $(wc -l < "$LEDGER") entries"
          else
            echo "ledger: no $STATE_BRANCH branch yet, starting empty"
          fi

      - name: Collect into the review queue
        id: collect
        env:
          MAX_ITEMS: ${{ github.event.inputs.max_items || '40' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          uv run --project collectors gt-collect \
            --config collectors/config/feeds.yaml \
            --queue-dir queue \
            --state "$LEDGER" \
            --max-items "$MAX_ITEMS" \
            --archive \
            --run-url "$RUN_URL"
          {
            echo "queued=$(python3 -c 'import json;print(json.load(open("queue/summary.json"))["queued"])')"
            echo "title=$(head -n 1 queue/issue-title.txt)"
          } >> "$GITHUB_OUTPUT"
          cat queue/summary.json

      - name: Upload the batch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: queue-${{ github.run_id }}
          path: queue/
          retention-days: 14
          if-no-files-found: error

      - name: Open the review queue issue
        if: ${{ steps.collect.outputs.queued != '0' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ steps.collect.outputs.title }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --force --color "0e8a16" \
            --description "İnsan inceleme kuyruğu / human review queue (unverified candidates)"
          # One issue per day: a second run on the same day comments on the open one.
          number=$(gh issue list --state open --label "$LABEL" --json number,title \
            | python3 -c 'import json,os,sys; t=os.environ["TITLE"]; print(next((str(i["number"]) for i in json.load(sys.stdin) if i["title"] == t), ""))')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file queue/issue.md
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file queue/issue.md
          fi

      - name: Publish the batch for the ingest Worker
        # The whole run — queued, deferred and off-topic alike — as the file `apps/ingest` pulls
        # into D1. Needs no credential: it writes two files into the working tree, and the commit
        # step below puts them on the `collector-state` branch. Runs after the issue like every
        # other write here, so a queue nobody could be shown is never recorded as delivered.
        id: publish
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$BATCHES"
          # What the branch already holds, so old batches can be pruned in the same commit.
          git ls-tree --name-only "FETCH_HEAD:$BATCHES" > "$RUNNER_TEMP/batches.txt" 2>/dev/null \
            || : > "$RUNNER_TEMP/batches.txt"
          uv run --project collectors gt-collect \
            --publish-batch queue \
            --batch-dir "$BATCHES" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL" \
            --existing "$RUNNER_TEMP/batches.txt"
          echo "rows=$(python3 -c 'import json;print(json.load(open("queue/publish.json"))["rows"])')" \
            >> "$GITHUB_OUTPUT"
          cat queue/publish.json

      - name: Commit the dedup ledger and the published batch
        # After the issue, never before: if the queue could not be shown to anyone, the items
        # must stay unseen so the next run offers them again.
        if: ${{ github.event.inputs.dry_run != 'true' && (steps.collect.outputs.queued != '0' || steps.publish.outputs.rows != '0') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Empty when the state branch does not exist yet: then this is the branch's first commit.
          parent=$(git rev-parse --verify --quiet FETCH_HEAD || true)
          # Build the commit with plumbing: no checkout of the state branch, no stray files, and
          # it works the same whether or not the branch already exists.
          GIT_INDEX_FILE=$(mktemp -u)
          export GIT_INDEX_FILE
          # Start from the branch as it is, so earlier batches survive this commit; with no branch
          # yet, start empty.
          if [ -n "$parent" ]; then git read-tree "$parent"; else git read-tree --empty; fi
          git update-index --add --cacheinfo "100644,$(git hash-object -w "$LEDGER"),$LEDGER"
          git update-index --add --cacheinfo \
            "100644,$(git hash-object -w collectors/state/README.md),collectors/state/README.md"
          if [ -f queue/publish.json ]; then
            # Paths from publish.json only, and every one of them matches <day>-<run id>.json or
            # latest.json, so there is nothing in them for the shell to split on.
            for f in $(python3 -c 'import json;d=json.load(open("queue/publish.json"));print(d["file"]);print(d["pointer"])'); do
              git update-index --add --cacheinfo "100644,$(git hash-object -w "$f"),$f"
            done
            for f in $(python3 -c 'import json;print("\n".join(json.load(open("queue/publish.json"))["prune"]))'); do
              git update-index --force-remove "$f"
            done
          fi
          tree=$(git write-tree)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then
            echo "collector state unchanged; nothing to push"
            exit 0
          fi
          printf 'Collectors: dedup ledger and published batch after run %s\n\n%s\n' \
            "${GITHUB_RUN_ID}" "$RUN_URL" > "$RUNNER_TEMP/msg"
          commit=$(GIT_AUTHOR_NAME="github-actions[bot]" \
            GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="github-actions[bot]" \
            GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            TZ=UTC git commit-tree "$tree" ${parent:+-p "$parent"} -F "$RUNNER_TEMP/msg")
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$commit:refs/heads/$STATE_BRANCH"

      - name: Push the batch into D1 directly (optional, normally skipped)
        # The old push path. Nothing depends on it any more: the batch published above is what
        # fills both databases, through the `gt-ingest` Worker, and this repository holds no
        # Cloudflare secret. The step stays because the same command is how a maintainer fills D1
        # from their own machine with `wrangler login`, and because a repository that *does* have
        # a token (a fork, a future environment) can still take the short route.
        #
        # Skipping it is the normal case and is not a failure: the rows are already on the
        # `collector-state` branch, and the Worker's next tick writes them. Both writes are
        # ON CONFLICT DO NOTHING in either path, so running both changes nothing.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only needed if the token can see more than one Cloudflare account; not a secret.
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "d1: no CLOUDFLARE_API_TOKEN secret here, which is the expected state — not pushing."
            echo "d1: the batch for this run is published on the $STATE_BRANCH branch and the"
            echo "d1: gt-ingest Worker (apps/ingest) writes it into gt-signals and gt-ops.reviews."
            exit 0
          fi
          if [ -n "${CF_ACCOUNT_ID:-}" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          fi
          uv run --project collectors gt-collect --write-d1 queue
