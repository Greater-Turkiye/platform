name: collectors-ci

# Lint and test the Python collectors. No schedule: collectors are dispatched by the
# scheduler Worker (ADR 0008); this workflow only checks code.
on:
  pull_request:
    paths:
      - "collectors/**"
      - "apps/web/assets/data/countries-50m.json" # geofence source
      - ".github/workflows/collectors-ci.yml"

permissions:
  contents: read

concurrency:
  group: collectors-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: collectors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Geofence is reproducible from Natural Earth
        run: python -m gt_collectors.tools.build_geofence --check
      - name: Tests (safety filter tests are mandatory)
        run: python -m pytest
