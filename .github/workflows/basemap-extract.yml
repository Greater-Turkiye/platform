name: basemap-extract

# Builds a new basemap archive (tools/geo/build_basemap.md) on a runner and publishes it as a
# release asset, so nobody has to move a gigabyte through a home connection. It only prepares the
# archive: the tiles Worker keeps serving the old one until its ARCHIVES setting names the new id
# and it is deployed, and the page keeps asking for the old id until basemap.js is changed.
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "lon0,lat0,lon1,lat1"
        default: "13,22,74,56"
        type: string
      maxzoom:
        description: "Highest zoom level"
        default: "11"
        type: string

permissions:
  contents: write  # create the release that carries the archive

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Tools
        run: |
          curl -sL -o pm.tgz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar xzf pm.tgz pmtiles && sudo mv pmtiles /usr/local/bin/ && pmtiles version
      - name: Extract the newest planet build for the box
        env:
          BBOX: ${{ inputs.bbox }}
          MAXZOOM: ${{ inputs.maxzoom }}
        run: |
          key=$(curl -s https://build-metadata.protomaps.dev/builds.json | python3 -c "import sys,json; print(json.load(sys.stdin)[-1]['key'])")
          date=${key%.pmtiles}
          echo "DATE=$date" >> "$GITHUB_ENV"
          pmtiles extract "https://build.protomaps.com/$key" region-z0-11.pmtiles --bbox="$BBOX" --maxzoom="$MAXZOOM" --download-threads=8
          pmtiles show region-z0-11.pmtiles | tee show.txt
          ls -la region-z0-11.pmtiles
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
          BBOX: ${{ inputs.bbox }}
          MAXZOOM: ${{ inputs.maxzoom }}
        run: |
          tag="basemap-$DATE"
          size=$(du -m region-z0-11.pmtiles | cut -f1)
          {
            echo "OpenStreetMap basemap extract, Protomaps build $DATE, bbox $BBOX, zoom 0-$MAXZOOM, ${size} MB."
            echo
            echo "A Produced Work of OpenStreetMap data, © OpenStreetMap contributors, ODbL 1.0."
            echo
            echo "To serve it: add \"region-$DATE\" to ARCHIVES in apps/tiles/wrangler.jsonc, deploy the Worker,"
            echo "then point GT_TILES in apps/web/assets/js/basemap.js at region-$DATE (tools/geo/build_basemap.md)."
            echo
            echo '```'; cat show.txt; echo '```'
          } > notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target main --title "Basemap archive · OSM ${DATE:0:4}-${DATE:4:2}-${DATE:6:2}" --notes-file notes.md
          gh release upload "$tag" region-z0-11.pmtiles --repo "$GITHUB_REPOSITORY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/region-z0-11.pmtiles" >> "$GITHUB_STEP_SUMMARY"
