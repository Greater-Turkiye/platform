name: db-ci

# Apply the D1 migrations to in-memory SQLite and check constraints (standard library only).
on:
  pull_request:
    paths:
      - "db/**"
      - ".github/workflows/db-ci.yml"

permissions:
  contents: read

concurrency:
  group: db-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: SQLite version
        run: python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - name: Migration tests
        run: python -m unittest discover -s db/tests -v
