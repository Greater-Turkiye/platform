version: 2
updates:
  # Keeps SHA-pinned actions current (ARCHITECTURE.md §8).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /collectors
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # The scheduler Worker's toolchain (wrangler, vitest); nothing here ships to the Worker.
  - package-ecosystem: npm
    directory: /apps/scheduler
    schedule:
      interval: weekly
    groups:
      scheduler:
        patterns: ["*"]
  # The review bot's toolchain (wrangler, vitest); nothing here ships to the Worker.
  - package-ecosystem: npm
    directory: /apps/review-bot
    schedule:
      interval: weekly
    groups:
      review-bot:
        patterns: ["*"]
